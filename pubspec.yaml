
name: bookease
description: "BookEase - Premium Service Booking Mobile and Tablet App in Flutter 3.x with Material 3."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2
  flutter_screenutil: ^5.9.3

  # Fonts & Icons
  google_fonts: ^6.2.1

  # Local Persistence & Storage
  shared_preferences: ^2.2.3

  # Network & API
  http: ^1.2.1

  # Date & Calendar formatting
  intl: ^0.20.3

  # Local Notifications & Reminders
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3

  # UI Animations & Feedback
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
